name: extract-request

# Repo-secret extraction backend for the Pages demo (see docs/index.html).
# The demo dispatches this with a gzip+base64 payload; the job runs the shared
# Gemini extractor using the GEMINI_API_KEY repo secret and commits the result
# for the page to poll. The key is only ever injected here, never into a page.
#
# PRIVACY: workflow_dispatch inputs are visible to anyone who can read this repo,
# so text submitted this way is effectively public. Do not submit confidential
# documents. Results are pruned after a day by the retention step below.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque request id from the demo page (8-32 lowercase hex)"
        required: true
        type: string
      payload_gz_b64:
        description: "gzip+base64 JSON {\"documents\":[...],\"model\":\"...\"}"
        required: true
        type: string

# Needed to commit the result back (the GITHUB_TOKEN is read-only by default).
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Values reach the script through the environment, never interpolated into
      # the shell, so a hostile payload cannot inject commands.
      - name: Extract with the repo secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_GZ_B64: ${{ inputs.payload_gz_b64 }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/extract_request.py
      - name: Prune results older than one day
        run: find docs/data/extract-results -name '*.json' -mtime +1 -delete || true
      - name: Commit the result
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git config user.name  "binder-ci"
          git config user.email "binder-ci@users.noreply.github.com"
          git add docs/data/extract-results
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "extract-result(${REQUEST_ID})"
            git push
          fi
